<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client Dashboard - UNO Studio</title>
    <link rel="stylesheet" href="dashboard.css">
</head>
<body>
    <header class="dashboard-header">
        <div class="container">
            <a href="Uno Studio.html" class="logo">UNO STUDIO</a>
            <button id="logout-button" class="logout-btn">Logout</button>
        </div>
    </header>

    <main class="container">
        <div class="dashboard-grid">
            <!-- Kolom untuk membuat reservasi -->
            <div class="card">
                <h2>Buat Reservasi Baru</h2>
                <form id="booking-form">
                    <div class="form-group">
                        <label for="service-select">Pilih Layanan</label>
                        <select id="service-select" required>
                            <!-- Opsi layanan akan dimuat di sini -->
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="reservation-date">Pilih Tanggal</label>
                        <input type="date" id="reservation-date" required>
                    </div>
                    <div class="form-group">
                        <label>Pilih Jam Tersedia</label>
                        <div id="time-slots-container" class="time-slots">
                            <!-- Slot waktu akan dimuat di sini -->
                            <p>Silakan pilih tanggal terlebih dahulu.</p>
                        </div>
                    </div>
                     <div class="form-group">
                        <label for="notes">Catatan (Opsional)</label>
                        <textarea id="notes" rows="3" placeholder="Contoh: Request background warna biru."></textarea>
                    </div>
                    <button type="submit" class="cta-button">Booking Sekarang</button>
                </form>
            </div>

            <!-- Kolom untuk melihat riwayat reservasi -->
            <div class="card">
                <h2>Reservasi Anda</h2>
                <div id="client-reservations-list">
                    <!-- Daftar reservasi client akan dimuat di sini -->
                </div>
            </div>
        </div>
    </main>

<script src="https://app.midtrans.com/snap/snap.js" data-client-key="Mid-client-HNtSPnBnCaLGdEQL"></script>

<script>
// Ambil user login
const supabaseClient = supabase.createClient(
  "https://gqkpcvcnuchbboslopcx.supabase.co",
  "PUBLIC_ANON_KEY"
);

// Ketika form booking dikirim
document.getElementById("booking-form").addEventListener("submit", async (e) => {
    e.preventDefault();

    const {
        data: { user }
    } = await supabaseClient.auth.getUser();

    if (!user) {
        alert("Silakan login terlebih dahulu.");
        return;
    }

    const payload = {
        user_id: user.id,
        fullname: user.user_metadata.fullname ?? "User",
        email: user.email,
        service: document.getElementById("service-select").value,
        date: document.getElementById("reservation-date").value,
        time: document.getElementById("time-slots-container").dataset.selected,
        notes: document.getElementById("notes").value,
    };

    const response = await fetch(
        "https://gqkpcvcnuchbboslopcx.supabase.co/functions/v1/create-transaction",
        {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
        }
    );

    const result = await response.json();

    if (result.token) {
        window.snap.pay(result.token);
    } else {
        alert("Gagal membuat transaksi");
        console.log(result);
    }
});
</script>


    <!-- Supabase & Script -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>
</body>
</html>
