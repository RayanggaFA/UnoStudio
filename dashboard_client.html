<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client Dashboard - UNO Studio</title>
    <link rel="stylesheet" href="dashboard.css">
</head>
<body>
    <header class="dashboard-header">
        <div class="container">
            <a href="Uno Studio.html" class="logo">UNO STUDIO</a>
            <button id="logout-button" class="logout-btn">Logout</button>
        </div>
    </header>

    <main class="container">
        <div class="dashboard-grid">
            <!-- Kolom untuk membuat reservasi -->
            <div class="card">
                <h2>Buat Reservasi Baru</h2>
                <form id="booking-form">
                    <div class="form-group">
                        <label for="service-select">Pilih Layanan</label>
                        <select id="service-select" required>
                            <!-- Opsi layanan akan dimuat di sini -->
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="reservation-date">Pilih Tanggal</label>
                        <input type="date" id="reservation-date" required>
                    </div>
                    <div class="form-group">
                        <label>Pilih Jam Tersedia</label>
                        <div id="time-slots-container" class="time-slots">
                            <!-- Slot waktu akan dimuat di sini -->
                            <p>Silakan pilih tanggal terlebih dahulu.</p>
                        </div>
                    </div>
                     <div class="form-group">
                        <label for="notes">Catatan (Opsional)</label>
                        <textarea id="notes" rows="3" placeholder="Contoh: Request background warna biru."></textarea>
                    </div>
                    <button type="submit" class="cta-button">Booking Sekarang</button>
                </form>
            </div>

            <!-- Kolom untuk melihat riwayat reservasi -->
            <div class="card">
                <h2>Reservasi Anda</h2>
                <div id="client-reservations-list">
                    <!-- Daftar reservasi client akan dimuat di sini -->
                </div>
            </div>
        </div>
    </main>

    <!-- Supabase & Script -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>
</body>
</html>
