<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script type="text/javascript"
        src="https://app.sandbox.midtrans.com/snap/snap.js"
        data-client-key="Mid-client-HNtSPnBnCaLGdEQL"></script>
    <title>Client Dashboard - UNO Studio</title>
    <link rel="stylesheet" href="dashboard.css">
</head>
<body>
    <header class="dashboard-header">
        <div class="container">
            <a href="Uno Studio.html" class="logo">UNO STUDIO</a>
            <button id="logout-button" class="logout-btn">Logout</button>
        </div>
    </header>

    <main class="container">
        <div class="dashboard-grid">
            <!-- Kolom untuk membuat reservasi -->
            <div class="card">
                <h2>Buat Reservasi Baru</h2>
                <form id="booking-form">
                    <div class="form-group">
                        <label for="service-select">Pilih Layanan</label>
                        <select id="service-select" required>
                            <!-- Opsi layanan akan dimuat di sini -->
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="reservation-date">Pilih Tanggal</label>
                        <input type="date" id="reservation-date" required>
                    </div>
                    <div class="form-group">
                        <label>Pilih Jam Tersedia</label>
                        <div id="time-slots-container" class="time-slots">
                            <!-- Slot waktu akan dimuat di sini -->
                            <p>Silakan pilih tanggal terlebih dahulu.</p>
                        </div>
                    </div>
                     <div class="form-group">
                        <label for="notes">Catatan (Opsional)</label>
                        <textarea id="notes" rows="3" placeholder="Contoh: Request background warna biru."></textarea>
                    </div>
                    <button type="submit" class="cta-button">Booking Sekarang</button>
                </form>
                <!-- Booking Summary (akan muncul setelah pilih service, tanggal, dan jam) -->
                <div id="booking-summary" class="booking-summary">
                    <h3>📋 Ringkasan Booking</h3>
                    <div class="summary-row">
                        <span class="summary-label">Layanan</span>
                        <span class="summary-value" id="summary-service">-</span>
                    </div>
                    <div class="summary-row">
                        <span class="summary-label">Tanggal</span>
                        <span class="summary-value" id="summary-date">-</span>
                    </div>
                    <div class="summary-row">
                        <span class="summary-label">Waktu</span>
                        <span class="summary-value" id="summary-time">-</span>
                    </div>
                    <div class="summary-row">
                        <span class="summary-label">Durasi</span>
                        <span class="summary-value" id="summary-duration">-</span>
                    </div>
                    <div class="summary-row">
                        <span class="summary-label">Harga per Jam</span>
                        <span class="summary-value" id="summary-price-per-hour">-</span>
                    </div>
                    <div class="summary-row">
                        <span class="summary-label">Total Pembayaran</span>
                        <span class="summary-value" id="summary-total">Rp 0</span>
                    </div>
                    
                    <button type="button" id="btn-pay" class="btn-pay">
                        💳 Bayar Sekarang
                    </button>
                </div>
            </div>

            <!-- Kolom untuk melihat riwayat reservasi -->
            <div class="card">
                <h2>Reservasi Anda</h2>
                <div id="client-reservations-list">
                    <!-- Daftar reservasi client akan dimuat di sini -->
                </div>
            </div>
        </div>
    </main>

    <!-- Supabase & Script -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>
</body>
</html>
