<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - UNO Studio</title>
    <link rel="stylesheet" href="auth.css">
</head>
<body>
    <div class="auth-container">
        <a href="Uno Studio.html" class="logo">UNO STUDIO</a>
        <h2>Buat Akun Baru</h2>
        <p>Daftar untuk mulai melakukan reservasi di UNO Studio.</p>
        <form id="register-form">
            <div class="form-group">
                <label for="full-name">Nama Lengkap</label>
                <input type="text" id="full-name" required>
            </div>
            <div class="form-group">
                <label for="phone">Nomor Telepon</label>
                <input type="tel" id="phone" required>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" required minlength="6">
            </div>
            <button type="submit" class="auth-button">Register</button>
        </form>
        <p id="error-message" class="error-text"></p>
        <p class="redirect-link">Sudah punya akun? <a href="login.html">Login di sini</a></p>
    </div>

    <!-- Supabase & Script -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>
</body>
</html>
