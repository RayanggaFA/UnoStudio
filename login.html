<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - UNO Studio</title>
    <link rel="stylesheet" href="auth.css">
</head>
<body>
    <div class="auth-container">
        <a href="Uno Studio.html" class="logo">UNO STUDIO</a>
        <h2>Login</h2>
        <p>Silakan masuk untuk melanjutkan ke halaman reservasi.</p>
        <form id="login-form">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" required>
            </div>
            <button type="submit" class="auth-button">Login</button>
        </form>
        <p id="error-message" class="error-text"></p>
        <p class="redirect-link">Belum punya akun? <a href="register.html">Daftar di sini</a></p>
    </div>

    <!-- Supabase & Script -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>
</body>
</html>
